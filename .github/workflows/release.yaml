---
name: Release
on:
  push:
    tags: [v*]
permissions: {}
jobs:
  release:
    uses: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml@e51f0489838572acbab6eb550c56a4aac220dd48 # v10.0.1
    with:
      go-version-file: go.mod
      aqua_version: v2.64.0
      go_licenses_package: ./cmd/app
    permissions:
      contents: write
      id-token: write
      actions: read
      attestations: write
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  release-image:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0

      - run: ko version
        env:
          AQUA_GITHUB_TOKEN: ${{ github.token }}
      - run: cosign version
        env:
          AQUA_GITHUB_TOKEN: ${{ github.token }}

      - run: echo "KO_DOCKER_REPO=ghcr.io/${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"
      - run: ko build ./cmd/app --bare -t "$GITHUB_REF_NAME"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: docker pull "$KO_DOCKER_REPO:$GITHUB_REF_NAME"
      - run: |
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$KO_DOCKER_REPO:$GITHUB_REF_NAME")
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
      - run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "dummy" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: cosign sign "$IMAGE_DIGEST"
